name: Build and Release Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set package version
        run: echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build CarsonSH
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Debian package
        run: |
          PKG="carsonsh_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin"

          cp build/carsonsh "$PKG/usr/bin/carsonsh"
          chmod 755 "$PKG/usr/bin/carsonsh"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: carsonsh
          Version: ${VERSION}
          Section: shells
          Priority: optional
          Architecture: amd64
          Maintainer: Carson <carjam120443-netizen>
          Description: CarsonSH Unix shell
           A small experimental Unix shell written in C.
          EOF

          dpkg-deb --build "$PKG"
          mv "$PKG.deb" "carsonsh_${VERSION}_amd64.deb"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG"             "carsonsh_${VERSION}_amd64.deb"             --title "CarsonSH $TAG"             --generate-notes
