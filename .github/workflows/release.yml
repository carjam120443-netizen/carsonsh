name: Build and Release Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set package version
        run: echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build CarsonSH
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Debian package
        run: |
          PKG="carsonsh_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/fonts/truetype/carsonsh"
          mkdir -p "$PKG/usr/share/doc/carsonsh"

          cp build/carsonsh "$PKG/usr/bin/carsonsh"
          chmod 755 "$PKG/usr/bin/carsonsh"

          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/ubuntucondensed/UbuntuCondensed-Regular.ttf"             -o "$PKG/usr/share/fonts/truetype/carsonsh/UbuntuCondensed-Regular.ttf"

          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ufl/ubuntucondensed/OFL.txt"             -o "$PKG/usr/share/doc/carsonsh/UbuntuCondensed-LICENSE.txt" ||             curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ufl/ubuntucondensed/UFL.txt"             -o "$PKG/usr/share/doc/carsonsh/UbuntuCondensed-LICENSE.txt"

          cat > "$PKG/usr/bin/carsonsh-font" <<'EOF'
          #!/bin/sh
          set -eu
          FONT="/usr/share/fonts/truetype/carsonsh/UbuntuCondensed-Regular.ttf"

          if [ -f "$FONT" ]; then
              echo "Ubuntu Condensed is installed:"
              echo "  $FONT"
              echo
              echo "Set your terminal emulator's font to: Ubuntu Condensed"
          else
              echo "CarsonSH: Ubuntu Condensed is not installed." >&2
              exit 1
          fi
          EOF
          chmod 755 "$PKG/usr/bin/carsonsh-font"

          cat > "$PKG/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v fc-cache >/dev/null 2>&1; then
              fc-cache -f >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG/DEBIAN/postinst"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: carsonsh
          Version: ${VERSION}
          Section: shells
          Priority: optional
          Architecture: amd64
          Maintainer: Carson <carjam120443-netizen>
          Depends: fontconfig
          Description: CarsonSH Unix shell
           A small experimental Unix shell written in C with Ubuntu Condensed font support.
          EOF

          dpkg-deb --build "$PKG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG"             "carsonsh_${VERSION}_amd64.deb"             --title "CarsonSH $TAG"             --generate-notes
