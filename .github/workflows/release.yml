name: Build and Release CarsonSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set package version
        run: echo "VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build CarsonSH
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Build Debian package
        run: |
          PKG="carsonsh_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/fonts/truetype/carsonsh"
          mkdir -p "$PKG/usr/share/doc/carsonsh" "$PKG/usr/share/carsonsh/framework/themes" "$PKG/usr/share/carsonsh/framework/plugins"
          cp build/carsonsh "$PKG/usr/bin/carsonsh"
          chmod 755 "$PKG/usr/bin/carsonsh"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ufl/ubuntucondensed/UbuntuCondensed-Regular.ttf" -o "$PKG/usr/share/fonts/truetype/carsonsh/UbuntuCondensed-Regular.ttf"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ufl/ubuntucondensed/UFL.txt" -o "$PKG/usr/share/doc/carsonsh/UbuntuCondensed-LICENSE.txt"
          cp framework/themes/*.conf "$PKG/usr/share/carsonsh/framework/themes/"
          cp framework/plugins/*.conf "$PKG/usr/share/carsonsh/framework/plugins/"
          cat > "$PKG/usr/bin/carsonsh-font" <<'EOF'
          #!/bin/sh
          set -eu
          FONT="/usr/share/fonts/truetype/carsonsh/UbuntuCondensed-Regular.ttf"
          if [ -f "$FONT" ]; then
              echo "Ubuntu Condensed is installed: $FONT"
              echo "Choose Ubuntu Condensed in your terminal emulator's font settings."
          else
              echo "CarsonSH: Ubuntu Condensed is not installed." >&2
              exit 1
          fi
          EOF
          chmod 755 "$PKG/usr/bin/carsonsh-font"
          cat > "$PKG/usr/bin/carsonsh-framework" <<'EOF'
          #!/bin/sh
          set -eu
          FRAMEWORK="/usr/share/carsonsh/framework"
          CONFIG="${HOME}/.config/carsonsh"
          THEMES="${CONFIG}/themes"
          PLUGINS="${CONFIG}/plugins"
          usage() { echo "Usage: carsonsh-framework {select-theme NAME|install theme|plugin NAME|list themes|plugins|update}"; }
          install_component() {
            kind="$1"; name="$2"; src="$FRAMEWORK/$kind/$name.conf"
            [ -f "$src" ] || { echo "Component not found: $name" >&2; exit 1; }
            if [ "$kind" = themes ]; then mkdir -p "$THEMES"; cp "$src" "$THEMES/"; else mkdir -p "$PLUGINS"; cp "$src" "$PLUGINS/"; fi
            echo "Installed $kind component: $name"
          }
          case "${1:-}" in
            select-theme) [ "$#" -eq 2 ] || { usage; exit 1; }; mkdir -p "$CONFIG"; printf 'theme %s\n' "$2" >> "$CONFIG/config"; install_component themes "$2" ;;
            install) [ "$#" -eq 3 ] || { usage; exit 1; }; case "$2" in theme) install_component themes "$3" ;; plugin) install_component plugins "$3" ;; *) usage; exit 1 ;; esac ;;
            list) [ "$#" -eq 2 ] || { usage; exit 1; }; case "$2" in themes) find "$FRAMEWORK/themes" -maxdepth 1 -name '*.conf' -printf '%f\n' | sed 's/\.conf$//' ;; plugins) find "$FRAMEWORK/plugins" -maxdepth 1 -name '*.conf' -printf '%f\n' | sed 's/\.conf$//' ;; *) usage; exit 1 ;; esac ;;
            update) mkdir -p "$THEMES" "$PLUGINS"; cp "$FRAMEWORK/themes/"*.conf "$THEMES/"; cp "$FRAMEWORK/plugins/"*.conf "$PLUGINS/"; echo "Framework updated." ;;
            *) usage; exit 1 ;;
          esac
          EOF
          chmod 755 "$PKG/usr/bin/carsonsh-framework"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: carsonsh
          Version: ${VERSION}
          Section: shells
          Priority: optional
          Architecture: amd64
          Maintainer: Carson <carjam120443-netizen>
          Depends: fontconfig
          Description: CarsonSH Unix shell and framework
           Experimental C shell with prompt fallback and native themes/plugins.
          EOF
          dpkg-deb --build "$PKG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" "carsonsh_${VERSION}_amd64.deb" --title "CarsonSH $TAG" --generate-notes

  release-windows:
    needs: release-deb
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc zip
      - name: Build and package Windows x64
        shell: msys2 {0}
        run: |
          chmod +x build.sh
          CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -O2 -static -static-libgcc' ./build.sh
          mkdir -p carsonsh-windows-x64
          cp build/carsonsh.exe carsonsh-windows-x64/
          ldd build/carsonsh.exe | awk '/=> \/.*\.dll/ {print $3} /^\/.*\.dll/ {print $1}' | while read dll; do
            [ -f "$dll" ] && cp -n "$dll" carsonsh-windows-x64/ || true
          done
          cat > carsonsh-windows-x64/README.txt <<'EOF'
          CarsonSH for Windows x64
          
          Run carsonsh.exe from Windows Terminal or Command Prompt.
          The included DLL files are runtime dependencies from MSYS2.
          This is an experimental Windows build; some Unix commands and path conventions differ on Windows.
          
          If Unicode prompt symbols do not render correctly, set CARSONSH_ASCII=1 before launching CarsonSH.
          EOF
          zip -r carsonsh-windows-x64.zip carsonsh-windows-x64
      - name: Upload Windows build to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          gh release upload $tag carsonsh-windows-x64.zip --clobber